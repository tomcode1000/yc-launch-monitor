# YC Launch Monitor - runtime configuration.
# Everything here is hot-editable; nothing in this file requires a code change.

agent:
  model: claude-opus-5
  max_tokens: 16000
  # Hard ceiling on tool-calling turns per cycle. Stops a runaway loop from
  # spending the client's Anthropic budget on a bad day.
  max_iterations: 40
  # Below this, a claim is logged for review instead of alerted. Raise it if
  # false positives appear; lower it once the client trusts the feed.
  confidence_threshold: 0.75

# When true, the paid Apify sources do not run on the background timer at all:
# they fire only when Pond invokes the agent (POST /runs) or an operator calls
# /admin/scan. The free sources keep ticking either way, so the directory watch,
# the Slack digest and /health stay live between requests.
#
# This is the right setting for a marketplace listing, where the agent is idle
# most of the time and a six-hour timer would drain the Apify balance on nobody's
# behalf. Set METERED_ON_REQUEST_ONLY in the environment to override without a
# redeploy.
metered_on_request_only: true

# Poll intervals are per source, not global. The free sources can run at
# minute-level freshness; the metered one cannot. See README "Cadence".
sources:
  yc_directory:
    enabled: true
    interval_seconds: 60
    # The directory is the VERIFICATION ORACLE, not a news source. A company
    # appearing here has already been announced by YC, so alerting on it is
    # noise. Keep polling (social leads are checked against this to decide
    # EARLY SIGNAL vs CONFIRMED); set true only to alert on listings directly.
    alert_on_new_listing: false
    # Batches to watch. Mid-fill batches are where early detection pays off.
    batches: ["Fall 2026", "Winter 2027", "Spring 2026", "Summer 2026"]

  yc_speedrun:
    enabled: true
    interval_seconds: 300
    portfolio_url: "https://speedrun.a16z.com/"

  x:
    enabled: true
    interval_seconds: 180
    # Tier 1: free profile timelines, no account needed. Staggered across ticks.
    # Empty: tiers 1 and 2 (free syndication timelines) are off. They are
    # rate-limited by IP, returned 429 constantly, and produced noise in the
    # logs that made the paid keyword tier hard to reason about. The Apify
    # keyword search is the one path that finds founders we do not follow.
    watchlist: []
    # Tier 3: keyword search. Off unless APIFY_TOKEN is set and X_KEYWORD_TIER=apify.
    keyword_interval_seconds: 900
    # ~$0.01/item, so 50 items is ~$0.50 per keyword sweep. Sized for an
    # announcement burst, when 15 would truncate the newest posts.
    max_items_per_run: 50
    # Wider than the obvious phrasings: exact-phrase search on six variants
    # matched only ten tweets, and founders announce in many ways. Batch codes
    # are the highest-signal terms - almost nobody writes "YC F26" casually.
    keywords:
      - "got into YC"
      - "we got into YC"
      - "accepted into Y Combinator"
    # apidojo/tweet-scraper answers every search with placeholder objects
    # carrying only {"noResults": true} - it returns nothing real. The lite
    # actor from the same publisher takes identical parameters and returns
    # actual tweets, so this is a one-line swap.
    apify_actor: "watcher.data/search-x-by-keywords"
    # Sized against the Apify balance, not against appetite. At $0.01/item,
    # 3 terms x 50 items is $1.50 a sweep - three requests would clear a $5
    # month. 15 keeps a full run near $0.50, under DAILY_SPEND_CAP_USD, and
    # the sweep is sorted latest-first, so the items dropped are the oldest
    # ones the lookback window would mostly have discarded anyway.
    max_items_per_term: 15

  linkedin:
    enabled: true
    # Metered. 6h keeps the bill near $22/mo; every minute would be ~$360/day.
    # Six hours and ten items: LinkedIn is the thinnest of the four sources
    # and bills per item, so it runs rarely and cheaply (~$0.05 a run) rather
    # than being switched off entirely.
    interval_seconds: 21600
    apify_actor: "apimaestro/linkedin-posts-search-scraper-no-cookies"
    apify_actor_fallback: "harvestapi/linkedin-post-search"
    max_items_per_run: 10
    # First-person announcement phrasings only. A bare "Y Combinator" matches
    # every mention on the platform - investors congratulating portfolio
    # companies, YC's own product posts, commentary - and we pay per item for
    # all of it. The lead is a founder announcing their own acceptance, so the
    # search should look like something a founder writes about themselves.
    keywords:
      - "we got into Y Combinator"
      - "we got into YC"
      - "excited to share that we got into"
      - "accepted into Y Combinator"
      - "joining Y Combinator"
      - "we're part of YC"
      - "thrilled to announce we've joined Y Combinator"
      - "joining a16z SPEEDRUN"
      - "accepted into a16z SPEEDRUN"
      # Batch codes carry the announcement on their own and satisfy the
      # classifier's batch requirement, which pure phrasings often do not:
      # plenty of founders write "we got into YC" with no batch at all.
      - "YC F26"
      - "YC W27"
      - "YC S26"
      - "YC X26"

slack:
  # Matches the alert cards in the task brief.
  early_header: ":zap: EARLY YC SIGNAL - Founder Announced Before YC"
  confirmed_header: ":white_check_mark: NEW YC COMPANY"

pond:
  # You declare this ceiling yourself; the schema sets no upper bound.
  # Pond validates each request's deadline_ms against it.
  max_run_seconds: 300
  max_request_bytes: 1048576
  max_attachment_bytes: 1048576
