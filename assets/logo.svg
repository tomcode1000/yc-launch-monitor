<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="YC Launch Monitor">
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#18221c"/>
      <stop offset="1" stop-color="#0b0f0d"/>
    </linearGradient>
    <linearGradient id="trace" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5ee08a" stop-opacity=".25"/>
      <stop offset=".42" stop-color="#5ee08a"/>
      <stop offset="1" stop-color="#5ee08a" stop-opacity=".35"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="9" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="512" height="512" rx="116" fill="url(#tile)"/>
  <rect x="1.5" y="1.5" width="509" height="509" rx="114.5" fill="none"
        stroke="#2b3a30" stroke-width="3"/>

  <!-- baseline grid: the quiet period the signal rises out of -->
  <g stroke="#233029" stroke-width="2">
    <line x1="86" y1="196" x2="426" y2="196"/>
    <line x1="86" y1="316" x2="426" y2="316"/>
  </g>

  <!-- the spike: detection happens left of centre, before the official mark -->
  <path d="M86 316 L146 316 L176 300 L206 314 L236 118 L266 314 L296 306 L336 316 L426 316"
        fill="none" stroke="url(#trace)" stroke-width="17"
        stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>

  <!-- the moment of detection -->
  <circle cx="236" cy="118" r="19" fill="#0b0f0d"/>
  <circle cx="236" cy="118" r="13" fill="#5ee08a"/>

  <!-- the official announcement, later and dimmer: the lead time between them
       is the whole product -->
  <line x1="368" y1="150" x2="368" y2="316" stroke="#e8b44a" stroke-width="7"
        stroke-linecap="round" stroke-dasharray="2 22" opacity=".85"/>
  <circle cx="368" cy="150" r="11" fill="#e8b44a" opacity=".9"/>

  <!-- lead-time span -->
  <g stroke="#6f7d6d" stroke-width="5" stroke-linecap="round">
    <line x1="236" y1="386" x2="368" y2="386"/>
    <line x1="236" y1="374" x2="236" y2="398"/>
    <line x1="368" y1="374" x2="368" y2="398"/>
  </g>
</svg>
